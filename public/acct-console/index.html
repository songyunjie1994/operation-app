<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账户中心采集管理</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#202a3b;font:15px system-ui,"Microsoft Yahei",sans-serif}main{max-width:1450px;margin:auto;padding:28px}h1{font-size:25px;margin:0 0 8px}h2{font-size:19px}p{line-height:1.6}.card{background:white;border:1px solid #e0e5ef;border-radius:12px;padding:20px;margin:18px 0;box-shadow:0 3px 12px #20304b05}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}input,button{font:inherit;padding:9px 13px;border:1px solid #c7cedd;border-radius:6px}button{background:#275edd;color:white;border-color:#275edd;cursor:pointer}button:disabled{opacity:.5;cursor:wait}input[type=number]{width:80px}input[type=checkbox]{width:18px;height:18px}.muted{color:#68768c}.error{color:#a92d2d;background:#fff0ed;padding:12px;border-radius:6px;white-space:pre-wrap}.good{color:#14734a}#notice:empty{display:none}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:14px}td,th{text-align:left;padding:10px;border-bottom:1px solid #e8ecf2}th{background:#f6f8fc}details{margin-top:12px}summary{cursor:pointer}.scroll{overflow:auto}.badge{padding:3px 8px;border-radius:5px;background:#edf1f8}a{color:#275edd}.hidden{display:none!important}
</style><main>
<h1>账户中心采集管理</h1><p class="muted">独立采集服务 · 页面每 20 秒更新 · 余额按币种分别展示，未采到的值显示 —</p>
<div id="notice" role="alert" class="error"></div>
<section class="card" id="login"><h2>管理员登录</h2><p>使用投流采集控制台的管理员账号。</p><form id="loginForm" class="row"><input id="email" type="email" placeholder="管理员邮箱" autocomplete="username" required><input id="password" type="password" placeholder="密码" autocomplete="current-password" required><button>登录</button></form></section>
<section id="dashboard" class="hidden"><div class="row"><button id="refresh">刷新</button><button id="logout">退出登录</button><a href="../">返回运营工作台</a><span id="loaded" class="muted"></span></div><div id="devices"></div><section class="card"><h2>最近运行记录</h2><div class="scroll"><table><thead><tr><th>结束时间</th><th>触发方式</th><th>结果</th><th>成功 / 总数</th><th>说明</th></tr></thead><tbody id="runs"></tbody></table></div></section></section>
</main><script src="console.js"></script></html>
