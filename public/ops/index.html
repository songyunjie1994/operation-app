<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>安必拓 · 运营中心</title><link rel="stylesheet" href="style.css"></head>
<body>
<section id="login" class="login"><div class="login-card"><div class="brand-mark">A</div><p class="eyebrow">ANBITO OPERATIONS</p><h1>运营数据，一个入口</h1><p class="muted">投流 · 经营 · 库存 · 账户</p><form id="login-form"><label for="email">管理员邮箱</label><input id="email" type="email" autocomplete="email" required placeholder="使用 Supabase 组织所有者邮箱"><button id="send-link" type="submit">发送登录链接</button></form><p id="login-message" role="status" class="muted">请先验证邮箱。新运营库的数据仅对授权成员开放。</p><p class="login-foot">成本系统保持独立。</p></div></section>
<div id="workspace" hidden>
<aside><div class="brand"><span class="brand-mark">A</span><span>安必拓<small>运营中心</small></span></div><nav aria-label="模块导航"><button data-module="business" class="active">经营数据</button><button data-module="traffic">投流管理</button><button data-module="inventory">库存数据</button><button data-module="account">账户资金</button></nav><div class="aside-note">独立运营项目<br><span>Supabase · 新加坡</span></div><button id="logout" class="logout">退出登录</button></aside>
<main><header><div><p class="eyebrow">ANBITO / OPERATIONS</p><h1 id="module-title">经营数据</h1></div><button id="refresh" class="secondary">刷新数据</button></header><section class="migration-note" id="migration-note"><strong>迁移核验中 · 只读入口</strong><span>账户、库存、经营已接入新库。投流暂为历史快照；完整历史仍待旧库恢复后核对。</span></section><div class="filters"><label>开始日期<input id="start" type="date"></label><label>结束日期<input id="end" type="date"></label><label>搜索<input id="search" type="search" placeholder="店铺 / 账户 / 商品"></label><label>平台<select id="platform"><option value="">全部平台</option><option value="douyin">抖店</option><option value="kuaishou">快手</option></select></label></div><p id="status" role="status" class="muted"></p><section id="summary" class="summary"></section><section class="panel"><div class="panel-title"><h2 id="table-title">店铺汇总</h2><span id="row-count" class="muted"></span></div><div id="table" class="table-wrap"></div></section><section id="cards" class="cards"></section><p class="footnote">金额按原币种和原口径显示。缺失值显示“—”；期间不完整时，汇总仅代表已采到的部分。账户和库存展示最新快照，日期筛选用于经营和投流记录。</p></main>
</div><script src="config.js"></script><script type="module" src="app.mjs"></script></body></html>
